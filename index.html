<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin the Wheel</title>
<style>
  :root {
    --bg: #0f1226;
    --panel: #1a1f3d;
    --panel-2: #232a52;
    --border: #2e356a;
    --text: #eef1ff;
    --muted: #9aa3c7;
    --left-a: #ff5c8a;
    --left-b: #ff9a5c;
    --right-a: #6c5ce7;
    --right-b: #00c9ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    inset: 0; width: 50%;
    pointer-events: none; z-index: 0;
  }
  body::before { background: radial-gradient(900px 700px at -10% 40%, rgba(255,92,138,0.16), transparent); }
  body::after  { left: 50%; background: radial-gradient(900px 700px at 110% 40%, rgba(108,92,231,0.16), transparent); }

  /* ── header / tabs ── */
  header {
    position: relative; z-index: 10;
    text-align: center;
    padding: 24px 16px 0;
  }
  header h1 {
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 800;
    letter-spacing: 0.4px;
  }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .tab-bar {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 20px;
    padding: 0 16px 0;
    position: relative; z-index: 10;
  }
  .tab-btn {
    border: none;
    padding: 11px 28px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.18s, color 0.18s, box-shadow 0.18s;
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .tab-btn.active {
    background: linear-gradient(135deg, #ff5c8a, #6c5ce7);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 6px 20px rgba(108,92,231,0.35);
  }
  .tab-btn:not(.active):hover { color: var(--text); border-color: #6c5ce7; }

  /* ── divider ── */
  .divider {
    position: fixed; top: 0; bottom: 0; left: 50%;
    width: 2px; transform: translateX(-50%);
    background: linear-gradient(180deg, transparent, var(--border) 20%, var(--border) 80%, transparent);
    z-index: 1; pointer-events: none;
  }
  .divider.hidden { display: none; }

  /* ── views ── */
  .view { display: none; position: relative; z-index: 2; }
  .view.active { display: block; }

  /* ══════════════ WHEEL VIEW ══════════════ */
  .arena {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: calc(100vh - 130px);
  }
  @media (max-width: 820px) { .arena { grid-template-columns: 1fr; } }

  .player {
    padding: 24px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .player.left  { --grad: linear-gradient(90deg, var(--left-a), var(--left-b));  --accent: var(--left-a); }
  .player.right { --grad: linear-gradient(90deg, var(--right-a), var(--right-b)); --accent: var(--right-a); }

  .player-name {
    font-size: clamp(18px, 2.5vw, 28px);
    font-weight: 800;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .canvas-holder {
    position: relative;
    width: min(300px, 78vw);
    height: min(300px, 78vw);
  }
  canvas { width: 100%; height: 100%; display: block; border-radius: 50%;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5), inset 0 0 0 5px rgba(255,255,255,0.05); }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 13px solid transparent; border-right: 13px solid transparent;
    border-top: 22px solid var(--accent);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4)); z-index: 5;
  }
  .hub {
    position: absolute; top: 50%; left: 50%;
    width: 48px; height: 48px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--grad);
    box-shadow: 0 5px 14px rgba(0,0,0,0.4), inset 0 0 0 3px rgba(255,255,255,0.14);
    z-index: 4; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 10px;
    cursor: pointer; user-select: none;
  }
  .hub:active { transform: translate(-50%, -50%) scale(0.93); }

  .spin-btn {
    border: none; padding: 11px 30px;
    font-size: 15px; font-weight: 700; border-radius: 999px; color: #fff;
    background: var(--grad); cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.28);
    transition: transform 0.08s ease, opacity 0.2s;
  }
  .spin-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .spin-btn:disabled { opacity: 0.38; cursor: not-allowed; }

  /* items panel */
  .panel {
    width: 100%; max-width: 320px;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.28);
  }
  .panel h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 10px; }

  .add-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .add-row input {
    flex: 1; min-width: 0;
    background: rgba(0,0,0,0.28); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px;
    color: var(--text); font-size: 13px; outline: none;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row button {
    border: none; background: var(--accent); color: #fff;
    padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .add-row button:hover { filter: brightness(1.12); }

  ul.items { list-style: none; max-height: 220px; overflow-y: auto; }
  ul.items li {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: 8px; margin-bottom: 4px;
    background: rgba(0,0,0,0.18);
  }
  .swatch { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
  .item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .remove {
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 5px; border-radius: 5px;
  }
  .remove:hover { color: var(--left-a); background: rgba(255,92,138,0.1); }

  .toolbar { display: flex; gap: 5px; margin-top: 9px; }
  .toolbar button {
    flex: 1; border: 1px solid var(--border); background: transparent;
    color: var(--muted); padding: 7px; border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  .toolbar button:hover { color: var(--text); border-color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 14px 0; font-size: 12px; }

  /* ══════════════ STATS VIEW ══════════════ */
  .stats-arena {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: calc(100vh - 130px);
  }
  @media (max-width: 820px) { .stats-arena { grid-template-columns: 1fr; } }

  .stats-half {
    padding: 28px 24px 60px;
  }
  .stats-half.left-half  { --grad: linear-gradient(90deg, var(--left-a), var(--left-b));  --accent: var(--left-a); }
  .stats-half.right-half { --grad: linear-gradient(90deg, var(--right-a), var(--right-b)); --accent: var(--right-a); }

  .stats-name {
    font-size: clamp(18px, 2.4vw, 26px);
    font-weight: 800;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 16px;
  }

  .stats-table-wrap {
    overflow-x: auto;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    box-shadow: 0 10px 32px rgba(0,0,0,0.3);
  }
  table.stats-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.stats-table thead th {
    padding: 12px 14px;
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    background: rgba(0,0,0,0.15);
  }
  table.stats-table tbody tr {
    border-bottom: 1px solid rgba(46,53,106,0.5);
    transition: background 0.12s;
  }
  table.stats-table tbody tr:last-child { border-bottom: none; }
  table.stats-table tbody tr:hover { background: rgba(255,255,255,0.03); }
  table.stats-table td {
    padding: 10px 14px;
    vertical-align: middle;
  }
  .td-item { display: flex; align-items: center; gap: 8px; }
  .td-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .td-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }

  /* star rating */
  .stars { display: flex; gap: 2px; }
  .star {
    font-size: 18px; cursor: pointer; color: #3a4070; transition: color 0.1s;
    line-height: 1; user-select: none; padding: 0 1px;
  }
  .star.on { color: #fdcb6e; }
  .star:hover { transform: scale(1.15); }

  /* time input */
  .time-input {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 8px;
    color: var(--text);
    font-size: 12px;
    width: 90px;
    outline: none;
  }
  .time-input:focus { border-color: var(--accent); }

  /* progress input */
  .prog-input {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 8px;
    color: var(--text);
    font-size: 12px;
    width: 110px;
    outline: none;
  }
  .prog-input:focus { border-color: var(--accent); }

  .stats-empty {
    text-align: center; color: var(--muted);
    padding: 32px; font-size: 13px;
  }

  /* completed checkbox + locked rows */
  .complete-cb { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
  tr.completed-row { opacity: 0.5; }
  tr.completed-row .td-label { text-decoration: line-through; }
  .star.locked { cursor: default; }
  .star.locked:hover { transform: none; }
  .time-input:disabled, .prog-input:disabled { cursor: not-allowed; opacity: 0.7; }

  /* ── result modal ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(5,7,20,0.72);
    backdrop-filter: blur(6px);
    display: none; place-items: center; z-index: 200;
  }
  .overlay.show { display: grid; }
  .result-card {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border); border-radius: 20px;
    padding: 36px 48px; text-align: center;
    max-width: 88vw;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    animation: pop 0.32s cubic-bezier(0.18,1.25,0.4,1);
  }
  @keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .rc-who { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
  .rc-winner {
    font-size: clamp(26px, 6vw, 48px); font-weight: 800;
    margin: 10px 0 24px; word-break: break-word;
  }
  .rc-close {
    border: none; color: #fff; padding: 12px 30px;
    border-radius: 999px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="divider" id="divider"></div>

  <header>
    <h1>🎡 Spin the Wheel</h1>
    <p>Two players — each spins their own wheel.</p>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="wheel">🎡 Wheel</button>
    <button class="tab-btn"        data-tab="stats">📊 Stats</button>
  </div>

  <!-- WHEEL VIEW -->
  <div class="view active" id="view-wheel">
    <div class="arena">
      <div class="player left"  id="p-left"></div>
      <div class="player right" id="p-right"></div>
    </div>
  </div>

  <!-- STATS VIEW -->
  <div class="view" id="view-stats">
    <div class="stats-arena">
      <div class="stats-half left-half">
        <div class="stats-name">SnackDetective</div>
        <div class="stats-table-wrap">
          <table class="stats-table">
            <thead><tr>
              <th>Item</th><th>Rating</th><th>Time Spent</th><th>Progress</th><th>Completed</th>
            </tr></thead>
            <tbody id="sb-left"></tbody>
          </table>
        </div>
      </div>
      <div class="stats-half right-half">
        <div class="stats-name">Jasan</div>
        <div class="stats-table-wrap">
          <table class="stats-table">
            <thead><tr>
              <th>Item</th><th>Rating</th><th>Time Spent</th><th>Progress</th><th>Completed</th>
            </tr></thead>
            <tbody id="sb-right"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="overlay" id="overlay">
    <div class="result-card">
      <div class="rc-who" id="rc-who"></div>
      <div class="rc-winner" id="rc-winner"></div>
      <button class="rc-close" id="rc-close">Spin again</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  const COLORS = [
    "#ff5c8a","#6c5ce7","#00b894","#fdcb6e","#0984e3",
    "#e17055","#00cec9","#a29bfe","#fab1a0","#55efc4",
    "#ffeaa7","#74b9ff","#fd79a8","#81ecec","#ff7675","#b2bec3"
  ];

  // ── shared modal ──
  const overlay  = document.getElementById("overlay");
  const rcWho    = document.getElementById("rc-who");
  const rcWinner = document.getElementById("rc-winner");
  const rcClose  = document.getElementById("rc-close");
  rcClose.addEventListener("click", () => overlay.classList.remove("show"));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("show"); });

  function showResult(playerName, winner, grad) {
    rcWho.textContent = playerName;
    [rcWho, rcWinner].forEach(el => {
      el.style.background = grad;
      el.style.webkitBackgroundClip = "text";
      el.style.backgroundClip = "text";
      el.style.color = "transparent";
    });
    rcWinner.textContent = winner;
    rcClose.style.background = grad;
    overlay.classList.add("show");
  }

  function colorFor(i) { return COLORS[i % COLORS.length]; }

  // ══════════ SHARED STORAGE (Supabase) ══════════
  // 1. Create a free project at supabase.com
  // 2. Settings → API → copy the Project URL and the "anon public" key below
  const SUPABASE_URL  = "https://tjcayvpeapmlqycosrnz.supabase.co/rest/v1/";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqY2F5dnBlYXBtbHF5Y29zcm56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzODIwOTksImV4cCI6MjEwMTk1ODA5OX0.3bADe9g0cSE8Ow440fAVktyimzpOKaLBW5mkOH2Ketg";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // In-memory mirror of the remote table, so the rest of the app can stay synchronous.
  const CACHE = {};
  const saveTimers = {};

  // ── little status pill, bottom-right ──
  const statusEl = document.createElement("div");
  statusEl.style.cssText =
    "position:fixed;right:14px;bottom:14px;z-index:99;padding:6px 12px;border-radius:999px;" +
    "font:600 12px system-ui;background:rgba(0,0,0,0.45);border:1px solid #2e356a;color:#9aa3c7;" +
    "opacity:0;transition:opacity 0.3s;pointer-events:none;backdrop-filter:blur(6px)";
  document.body.appendChild(statusEl);
  let statusTimer;
  function setStatus(msg, sticky) {
    statusEl.textContent = msg;
    statusEl.style.opacity = "1";
    clearTimeout(statusTimer);
    if (!sticky) statusTimer = setTimeout(() => { statusEl.style.opacity = "0"; }, 1600);
  }

  // Pull every row into CACHE. Called once on boot, and again when the tab regains focus.
  async function loadAll() {
    const { data, error } = await db.from("wheel_state").select("key,value");
    if (error) {
      console.error("Load failed:", error);
      setStatus("⚠ offline — changes won't save", true);
      return false;
    }
    data.forEach(row => { CACHE[row.key] = row.value; });
    return true;
  }

  // Same signatures as before, so nothing downstream changes.
  function ls(key, def) {
    return (key in CACHE && CACHE[key] != null) ? CACHE[key] : def;
  }

  function lsSave(key, val) {
    CACHE[key] = val;                     // update locally right away — UI stays instant
    clearTimeout(saveTimers[key]);        // debounce: typing fast shouldn't spam the DB
    saveTimers[key] = setTimeout(async () => {
      const { error } = await db
        .from("wheel_state")
        .upsert({ key, value: val, updated_at: new Date().toISOString() }, { onConflict: "key" });
      if (error) { console.error("Save failed:", error); setStatus("⚠ save failed", true); }
      else setStatus("saved ✓");
    }, 400);
  }

  // ── player registry for stats view ──
  const registry = {};

  // ── wheel factory ──
  function createPlayer({ containerId, name, itemsKey, statsKey, gradStart, gradEnd, defaults }) {
    const grad = `linear-gradient(90deg, ${gradStart}, ${gradEnd})`;
    let items = ls(itemsKey, defaults);
    let stats = ls(statsKey, {});   // { [itemName]: { rating, timeSpent, progress } }
    let rotation = 0, spinning = false;

    const root = document.getElementById(containerId);
    root.innerHTML = `
      <div class="player-name">${name}</div>
      <div class="canvas-holder">
        <div class="pointer"></div>
        <canvas width="480" height="480"></canvas>
        <div class="hub">SPIN</div>
      </div>
      <button class="spin-btn">Spin!</button>
      <div class="panel">
        <h3>Items</h3>
        <div class="add-row">
          <input type="text" placeholder="Add an item…" maxlength="40" autocomplete="off">
          <button>Add</button>
        </div>
        <ul class="items"></ul>
        <div class="empty">No items yet. Add a few above!</div>
        <div class="toolbar">
          <button class="t-shuffle">Shuffle</button>
          <button class="t-clear">Clear all</button>
        </div>
      </div>`;

    const canvas  = root.querySelector("canvas");
    const ctx     = canvas.getContext("2d");
    const hub     = root.querySelector(".hub");
    const spinBtn = root.querySelector(".spin-btn");
    const input   = root.querySelector(".add-row input");
    const addBtn  = root.querySelector(".add-row button");
    const ul      = root.querySelector("ul.items");
    const emptyEl = root.querySelector(".empty");

    root.querySelector(".pointer").style.borderTopColor = gradStart;
    hub.style.background = grad;

    function saveItems() { lsSave(itemsKey, items); }
    function saveStats() { lsSave(statsKey, stats); }

    function renderList() {
      ul.innerHTML = "";
      emptyEl.style.display = items.length ? "none" : "block";
      items.forEach((item, i) => {
        const li = document.createElement("li");
        const sw = Object.assign(document.createElement("span"), { className: "swatch" });
        sw.style.background = colorFor(i);
        const lbl = Object.assign(document.createElement("span"), { className: "item-name", textContent: item });
        const rm  = Object.assign(document.createElement("button"), { className: "remove", innerHTML: "&times;" });
        rm.addEventListener("click", () => { items.splice(i, 1); saveItems(); renderList(); draw(); });
        li.append(sw, lbl, rm);
        ul.appendChild(li);
      });
      spinBtn.disabled = items.length < 2;
    }

    function draw() {
      const sz = canvas.width, cx = sz/2, cy = sz/2, r = sz/2-4;
      ctx.clearRect(0, 0, sz, sz);
      if (!items.length) {
        ctx.fillStyle = "#232a52"; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = "#9aa3c7"; ctx.font = "17px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("Add items →", cx, cy); return;
      }
      const n = items.length, arc = Math.PI*2/n;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(rotation);
      for (let i=0; i<n; i++) {
        const s=i*arc, e=s+arc;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,s,e); ctx.closePath();
        ctx.fillStyle = colorFor(i); ctx.fill();
        ctx.lineWidth=2; ctx.strokeStyle="rgba(0,0,0,0.13)"; ctx.stroke();
        ctx.save(); ctx.rotate(s+arc/2); ctx.textAlign="right"; ctx.textBaseline="middle";
        ctx.fillStyle="#fff";
        ctx.font="bold "+Math.max(10,Math.min(18,240/n))+"px system-ui";
        ctx.shadowColor="rgba(0,0,0,0.4)"; ctx.shadowBlur=3;
        let t=items[i]; if(t.length>15) t=t.slice(0,14)+"…";
        ctx.fillText(t, r-12, 0); ctx.restore();
      }
      ctx.restore();
    }

    function winnerIndex() {
      const n=items.length, arc=Math.PI*2/n;
      let p=(-Math.PI/2-rotation)%(Math.PI*2); if(p<0) p+=Math.PI*2;
      return Math.floor(p/arc)%n;
    }

    function spin() {
      if (spinning||items.length<2) return;
      spinning=true; spinBtn.disabled=true;
      const n=items.length, arc=Math.PI*2/n;
      const target=Math.floor(Math.random()*n);
      const tc=target*arc+arc/2;
      const extra=5+Math.floor(Math.random()*4);
      let final=rotation-(rotation%(Math.PI*2))+(-Math.PI/2-tc)+extra*Math.PI*2;
      while(final<=rotation) final+=Math.PI*2;
      const start=rotation, delta=final-start, dur=4200+Math.random()*800, t0=performance.now();
      function ease(t){return 1-Math.pow(1-t,4);}
      function frame(now){
        const t=Math.min(1,(now-t0)/dur);
        rotation=start+delta*ease(t); draw();
        if(t<1){requestAnimationFrame(frame);return;}
        rotation=final%(Math.PI*2); draw();
        spinning=false; spinBtn.disabled=items.length<2;
        showResult(name, items[winnerIndex()], grad);
      }
      requestAnimationFrame(frame);
    }

    function addItem(){
      const v=input.value.trim(); if(!v) return;
      items.push(v); input.value=""; input.focus();
      saveItems(); renderList(); draw();
    }

    addBtn.addEventListener("click", addItem);
    input.addEventListener("keydown", e=>{if(e.key==="Enter") addItem();});
    spinBtn.addEventListener("click", spin);
    hub.addEventListener("click", spin);
    root.querySelector(".t-shuffle").addEventListener("click", ()=>{
      for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
      saveItems(); renderList(); draw();
    });
    root.querySelector(".t-clear").addEventListener("click", ()=>{
      if(items.length&&confirm(`Clear all of ${name}'s items?`)){items=[];saveItems();renderList();draw();}
    });

    renderList(); draw();

    // expose to stats view
    registry[containerId] = {
      name, grad, gradStart,
      getItems:  () => items,
      getStats:  () => stats,
      // re-read from CACHE after a remote change and repaint
      reload() {
        stats = ls(statsKey, {});        // stats always refresh — no animation to disturb
        if (spinning) return;            // but don't yank the wheel out mid-spin
        items = ls(itemsKey, defaults);
        renderList(); draw();
      },
      setStat(item, key, val) {
        if (!stats[item]) stats[item] = { rating: 0, timeSpent: "", progress: "Not Started", completed: false };
        stats[item][key] = val;
        saveStats();
      },
      removeFromWheel(item) {
        const idx = items.indexOf(item);
        if (idx !== -1) {
          items.splice(idx, 1);
          saveItems();
          renderList();
          draw();
        }
      },
      addToWheel(item) {
        if (!items.includes(item)) {
          items.push(item);
          saveItems();
          renderList();
          draw();
        }
      }
    };
  }

  const PLAYERS = [{
    containerId: "p-left",
    name:        "SnackDetective",
    itemsKey:    "wheel.snackdetective.items",
    statsKey:    "wheel.snackdetective.stats",
    gradStart:   "#ff5c8a",
    gradEnd:     "#ff9a5c",
    defaults:    ["Pizza","Burgers","Sushi","Tacos","Salad","Pasta"],
  }, {
    containerId: "p-right",
    name:        "Jasan",
    itemsKey:    "wheel.jasan.items",
    statsKey:    "wheel.jasan.stats",
    gradStart:   "#6c5ce7",
    gradEnd:     "#00c9ff",
    defaults:    ["Movies","Games","Hiking","Gym","Reading","Cooking"],
  }];

  // ── refresh every wheel + the stats table from CACHE ──
  function repaintAll() {
    Object.values(registry).forEach(p => p.reload());
    const statsView = document.getElementById("view-stats");
    if (!statsView || !statsView.classList.contains("active")) return;

    // If they're mid-way through typing in a stats cell, don't rebuild the
    // table underneath them — it would wipe the half-typed value.
    const el = document.activeElement;
    if (el && el.tagName === "INPUT" && el.type === "text" && statsView.contains(el)) return;

    renderStatsTable("sb-left",  "p-left");
    renderStatsTable("sb-right", "p-right");
  }

  // ── boot: load remote data FIRST, then build the wheels ──
  (async function boot() {
    setStatus("loading…", true);
    const online = await loadAll();

    PLAYERS.forEach(createPlayer);

    if (!online) return;   // offline: wheels still work locally, just won't persist

    // First run on a fresh database — write the starting lists so both people see the same thing
    PLAYERS.forEach(p => {
      if (!(p.itemsKey in CACHE)) lsSave(p.itemsKey, p.defaults);
      if (!(p.statsKey in CACHE)) lsSave(p.statsKey, {});
    });

    setStatus("connected ✓");

    // Live sync: when the other person edits, update without a refresh
    db.channel("wheel-sync")
      .on("postgres_changes",
          { event: "*", schema: "public", table: "wheel_state" },
          payload => {
            const row = payload.new;
            if (!row || !row.key) return;
            // ignore the echo of our own write
            if (JSON.stringify(CACHE[row.key]) === JSON.stringify(row.value)) return;
            CACHE[row.key] = row.value;
            repaintAll();
            setStatus("updated by other player");
          })
      .subscribe();

    // Safety net if realtime drops or was never enabled: re-sync when the tab is refocused
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState !== "visible") return;
      if (await loadAll()) repaintAll();
    });
  })();

  // ── stats table renderer ──
  function renderStatsTable(tbodyId, playerKey) {
    const player = registry[playerKey];
    const tbody  = document.getElementById(tbodyId);
    const stats  = player.getStats();

    // wheel items, plus any completed items that were already removed from the wheel
    const items = player.getItems().slice();
    Object.keys(stats).forEach(key => {
      if (stats[key].completed && !items.includes(key)) items.push(key);
    });

    tbody.innerHTML = "";

    if (!items.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 5;
      td.className = "stats-empty";
      td.textContent = "No items on the wheel yet.";
      tr.appendChild(td); tbody.appendChild(tr); return;
    }

    items.forEach((item, i) => {
      const s = stats[item] || { rating: 0, timeSpent: "", progress: "Not Started", completed: false };
      const locked = !!s.completed;
      const tr = document.createElement("tr");
      if (locked) tr.classList.add("completed-row");

      // item cell
      const tdItem = document.createElement("td");
      const wrap = document.createElement("div"); wrap.className = "td-item";
      const sw = document.createElement("span"); sw.className = "td-swatch"; sw.style.background = colorFor(i);
      const lbl = document.createElement("span"); lbl.className = "td-label"; lbl.textContent = item;
      wrap.append(sw, lbl); tdItem.appendChild(wrap);

      // rating cell (5 stars)
      const tdRating = document.createElement("td");
      const starWrap = document.createElement("div"); starWrap.className = "stars";
      for (let star=1; star<=5; star++) {
        const btn = document.createElement("span");
        btn.className = "star" + (star <= s.rating ? " on" : "") + (locked ? " locked" : "");
        btn.textContent = "★";
        if (!locked) {
          btn.addEventListener("click", () => {
            player.setStat(item, "rating", star);
            renderStatsTable(tbodyId, playerKey);
          });
        }
        starWrap.appendChild(btn);
      }
      tdRating.appendChild(starWrap);

      // time spent cell
      const tdTime = document.createElement("td");
      const timeInput = document.createElement("input");
      timeInput.className = "time-input"; timeInput.type = "text";
      timeInput.placeholder = "e.g. 2h"; timeInput.maxLength = 20;
      timeInput.value = s.timeSpent || "";
      timeInput.disabled = locked;
      timeInput.addEventListener("change", () => player.setStat(item, "timeSpent", timeInput.value.trim()));
      tdTime.appendChild(timeInput);

      // progress cell
      const tdProg = document.createElement("td");
      const progInput = document.createElement("input");
      progInput.className = "prog-input"; progInput.type = "text";
      progInput.placeholder = "e.g. 50%"; progInput.maxLength = 40;
      progInput.value = s.progress || "";
      progInput.disabled = locked;
      progInput.addEventListener("change", () => player.setStat(item, "progress", progInput.value.trim()));
      tdProg.appendChild(progInput);

      // completed checkbox cell
      const tdComplete = document.createElement("td");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.className = "complete-cb";
      cb.checked = locked;
      cb.addEventListener("change", () => {
        player.setStat(item, "completed", cb.checked);
        if (cb.checked) player.removeFromWheel(item);
        else player.addToWheel(item);
        renderStatsTable(tbodyId, playerKey);
      });
      tdComplete.appendChild(cb);

      tr.append(tdItem, tdRating, tdTime, tdProg, tdComplete);
      tbody.appendChild(tr);
    });
  }

  // ── tab switching ──
  const tabBtns  = document.querySelectorAll(".tab-btn");
  const views    = document.querySelectorAll(".view");
  const divider  = document.getElementById("divider");

  tabBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      tabBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const tab = btn.dataset.tab;
      views.forEach(v => v.classList.toggle("active", v.id === "view-"+tab));
      if (tab === "stats") {
        divider.classList.remove("hidden");
        renderStatsTable("sb-left",  "p-left");
        renderStatsTable("sb-right", "p-right");
      } else {
        divider.classList.remove("hidden");
      }
    });
  });

})();
</script>
</body>
